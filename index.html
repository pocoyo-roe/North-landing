<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>North Landing Sauna Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen drafting workspace — tool rail | drawing stage | calculation sheet. Collapses to a scrolling stack on phones. */
:root{
  --bg:#e9ece7;        /* chalk */
  --panel:#f7f8f5;
  --ink:#16242a;       /* North Sea slate */
  --muted:#5a686c;
  --line:#c9d0ca;
  --accent:#b4532a;    /* coble red / weathered larch */
  --accent-ink:#ffffff;
  --sea:#2c6b78;
  --timber:#d4b07a;
  --timber-2:#b48d55;
  --cedar:#8a5536;
  --water:#8cc2cf;
  --grid:rgba(22,36,42,.07);
  --grid-major:rgba(22,36,42,.16);
  --ok:#2f7d4a; --warn:#a86a00; --bad:#b3261e; --info:#2c6b78;
  --ok-bg:rgba(47,125,74,.12); --warn-bg:rgba(168,106,0,.13); --bad-bg:rgba(179,38,30,.12); --info-bg:rgba(44,107,120,.12);
  --mains:#1f6fd1; --drain:#7a5a2b; --power:#d97a00;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e181c; --panel:#142228; --ink:#e3eae7; --muted:#93a4a6; --line:#29404a;
  --accent:#e2804e; --accent-ink:#1a0d06; --sea:#6db2c0; --timber:#8d7148; --timber-2:#6f5735; --cedar:#6e4229; --water:#3b7d8d;
  --grid:rgba(227,234,231,.06); --grid-major:rgba(227,234,231,.14);
  --ok:#62c487; --warn:#e2a93b; --bad:#f07167; --info:#6db2c0;
  --ok-bg:rgba(98,196,135,.14); --warn-bg:rgba(226,169,59,.15); --bad-bg:rgba(240,113,103,.15); --info-bg:rgba(109,178,192,.14);
  --mains:#5aa2ff; --drain:#c49a5c; --power:#ffab3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e181c; --panel:#142228; --ink:#e3eae7; --muted:#93a4a6; --line:#29404a;
  --accent:#e2804e; --accent-ink:#1a0d06; --sea:#6db2c0; --timber:#8d7148; --timber-2:#6f5735; --cedar:#6e4229; --water:#3b7d8d;
  --grid:rgba(227,234,231,.06); --grid-major:rgba(227,234,231,.14);
  --ok:#62c487; --warn:#e2a93b; --bad:#f07167; --info:#6db2c0;
  --ok-bg:rgba(98,196,135,.14); --warn-bg:rgba(226,169,59,.15); --bad-bg:rgba(240,113,103,.15); --info-bg:rgba(109,178,192,.14);
  --mains:#5aa2ff; --drain:#c49a5c; --power:#ffab3d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding-inline:16px;padding-block:10px 12px;gap:10px}

/* header */
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{margin:0;font:800 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.brand .loc{font:12px/1.3 var(--f-mono);color:var(--muted)}
.brand .loc a{color:var(--sea)}
.tb{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}

/* main grid */
main.work{display:grid;grid-template-columns:196px minmax(0,1fr) 340px;gap:10px;min-height:0}
.rail,.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;overflow:auto}
.rail{padding:10px;display:flex;flex-direction:column;gap:14px}
.rail h2,.sheet h3{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.pal{display:grid;grid-template-columns:1fr;gap:4px}
.pal button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;cursor:pointer}
.pal button:hover{border-color:var(--line);background:var(--bg)}
.pal button.on{border-color:var(--ink);background:var(--bg)}
.sw{width:18px;height:14px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.2)}
.layers{display:flex;flex-direction:column;gap:2px;font-size:13px}
.layers button{all:unset;cursor:pointer;padding:3px 6px;border-radius:4px;display:flex;justify-content:space-between;gap:6px}
.layers button span:last-child{font:11px var(--f-mono);color:var(--muted)}
.layers button:hover{background:var(--bg)}
.layers button.on{background:var(--ink);color:var(--bg)}
.layers button.on span:last-child{color:var(--bg)}
.small{font-size:12px;color:var(--muted)}

/* stage */
.stage{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);min-height:0}
#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#plan.panning{cursor:grabbing}
#plan.drawing{cursor:crosshair}
#plan.movemap{cursor:move}
.attr{font:10px var(--f-body);color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:2px 6px;border-radius:4px;max-width:260px}
.ov.bl{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
#view3d{position:absolute;inset:0}
#view3d canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.ov{position:absolute;pointer-events:none}
.ov > *{pointer-events:auto}
.ov.tl{top:10px;left:10px}
.ov.tr{top:10px;right:10px;display:flex;gap:4px}
.ov.bl{bottom:10px;left:10px}
.ov.br{bottom:10px;right:10px;display:flex;gap:4px}
.ov.tc{top:10px;left:50%;transform:translateX(-50%);max-width:70%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.hint{background:var(--ink);color:var(--bg);border-radius:6px;padding:6px 10px;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:4px;padding:2px 8px;cursor:pointer}
.compass{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px;font:10px var(--f-mono);color:var(--muted)}
.compass svg{display:block}
.scalebar{font:11px var(--f-mono);color:var(--ink);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 6px;border-radius:4px}
.scalebar i{display:block;height:6px;border:2px solid var(--ink);border-top:0;margin-top:2px}

/* plan svg classes */
.deck{fill:var(--timber);stroke:var(--timber-2)}
.board{stroke:var(--timber-2);stroke-opacity:.55}
.stepr{fill:var(--timber);stroke:var(--ink)}
.cedar{fill:var(--cedar);stroke:var(--ink)}
.inner{fill:none;stroke:var(--bg);stroke-opacity:.55}
.water{fill:var(--water);stroke:var(--sea)}
.thing{fill:var(--panel);stroke:var(--ink)}
.pave{fill:var(--line);stroke:var(--muted)}
.guard{stroke:var(--accent);stroke-linecap:round}
.ink{stroke:var(--ink);fill:none}
.lbl{fill:var(--ink);font-family:var(--f-body);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-opacity:.85;pointer-events:none}
.lbl2{fill:var(--muted);font-family:var(--f-mono);paint-order:stroke;stroke:var(--bg);stroke-opacity:.85;pointer-events:none}
.contour{stroke:var(--sea);stroke-opacity:.35;fill:none}
.contourl{fill:var(--sea);font-family:var(--f-mono);opacity:.8;pointer-events:none}
.it{cursor:move}
.it.sel > :first-child{stroke:var(--accent)}
.hdl{fill:var(--panel);stroke:var(--accent);cursor:nwse-resize}
.hdl.rot{cursor:grab;fill:var(--accent)}
.selbox{fill:none;stroke:var(--accent);stroke-dasharray:4 3}
.svc{fill:none;stroke-linejoin:round;stroke-linecap:round;cursor:pointer}
.svc.mains{stroke:var(--mains)} .svc.drain{stroke:var(--drain)} .svc.power{stroke:var(--power)}
.vtx{fill:var(--panel);stroke:var(--accent);cursor:move}
.meas{stroke:var(--accent);fill:none}

/* sheet */
.sheet{display:flex;flex-direction:column}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.tabs button.on{border-bottom-color:var(--accent);color:var(--ink)}
.tabs button:not(.on){color:var(--muted)}
.pane{padding:12px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pane section{display:flex;flex-direction:column;gap:8px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 140px;align-items:center;gap:8px}
.fld > span:first-child{color:var(--muted);font-size:13px}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:5px;background:var(--bg);overflow:hidden}
.inp input,.inp select{border:0;background:transparent;padding:5px 6px;width:100%;min-width:0;font-family:var(--f-mono);font-size:13px}
.inp select{font-family:var(--f-body)}
.inp em{font:normal 11px var(--f-mono);color:var(--muted);padding-right:6px}
.inp input[type=checkbox]{width:auto;margin:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.read{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.read div{display:flex;justify-content:space-between;gap:10px;padding:5px 8px;border-top:1px solid var(--line);font-size:13px}
.read div:first-child{border-top:0}
.read b{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:999px;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)} .chip.info{color:var(--info);background:var(--info-bg)}
.empty{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:12px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted)}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px;border:1px solid var(--line);border-radius:6px;border-left-width:4px}
.check.ok{border-left-color:var(--ok)} .check.warn{border-left-color:var(--warn)} .check.bad{border-left-color:var(--bad)} .check.info{border-left-color:var(--info)}
.check h4{margin:0;font-size:13px;font-weight:600}
.check p{margin:0;font-size:12.5px;color:var(--muted);grid-column:2}
.check label{grid-column:2;font-size:12px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.tblw{overflow-x:auto}
table.bom{width:100%;border-collapse:collapse;font-size:12.5px}
table.bom th{font:600 10.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 4px;border-bottom:1px solid var(--line)}
table.bom td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.bom td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.bom tr.g td{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--sea);padding-top:10px}
table.bom input{width:64px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:2px 4px;font:12px var(--f-mono);text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;font:800 28px/1 var(--f-display);border-top:2px solid var(--ink);padding-top:8px}
.total small{font:12px var(--f-body);color:var(--muted)}
.sun{display:flex;gap:10px;align-items:center}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,22,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:560px;width:100%;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.modal h3{margin:0;font:800 22px/1 var(--f-display);text-transform:uppercase}
.modal textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:12px var(--f-mono);padding:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:30;font-size:13px}

@media (max-width: 980px){
  html,body{height:auto}
  .app{height:auto}
  main.work{grid-template-columns:minmax(0,1fr)}
  .stage{height:62vh;min-height:360px;order:1}
  .rail{order:2;overflow:visible}
  .sheet{order:3;overflow:visible}
  .pal{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .tabs{top:env(safe-area-inset-top,0px)}
}
@media (max-width: 480px){
  .brand h1{font-size:22px}
  .fld{grid-template-columns:minmax(0,1fr) 120px}
  .ov.tc{max-width:none;left:10px;right:10px;top:auto;bottom:48px;transform:none}
  .compass{padding:3px}.compass svg{width:78px;height:78px}.compass div{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>North Landing Sauna Designer</h1>
      <div class="loc" id="loc">North Landing, Flamborough · East Riding of Yorkshire</div>
    </div>
    <div class="tb">
      <button class="btn" id="b-undo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn" id="b-redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button class="btn" id="b-file">Save &amp; load</button>
    </div>
  </header>

  <main class="work">
    <aside class="rail" aria-label="Tools">
      <div>
        <h2>Add to plan</h2>
        <div class="pal" id="pal"></div>
      </div>
      <div>
        <h2>Services</h2>
        <div class="pal" id="pal-svc"></div>
      </div>
      <div>
        <h2>Tools</h2>
        <div class="pal">
          <button id="t-measure"><span class="sw" style="background:transparent;border-color:var(--accent)"></span>Measure / calibrate</button>
          <button id="t-bg"><span class="sw" style="background:var(--line)"></span>Site photo underlay</button>
          <button id="t-fit"><span class="sw" style="background:transparent"></span>Zoom to design</button>
        </div>
        <input type="file" id="bg-file" accept="image/*" hidden>
      </div>
      <div>
        <h2>On the plan</h2>
        <div class="layers" id="layers"></div>
      </div>
    </aside>

    <div class="stage" id="stage">
      <svg id="plan" aria-label="Site plan"><g id="tiles"></g><g id="draw"></g></svg>
      <div id="view3d" hidden></div>
      <div class="ov tl"><div class="compass" id="compass"></div></div>
      <div class="ov tr"><button class="btn" id="b-map" title="Change the map under the plan">Map: satellite</button><div class="seg" role="tablist"><button id="v-plan" class="on">Plan</button><button id="v-3d">3D</button></div></div>
      <div class="ov tc" id="hintwrap"></div>
      <div class="ov bl"><div class="attr" id="attr" hidden></div><div class="scalebar" id="scalebar"></div></div>
      <div class="ov br" id="zoombtns"><button class="btn" id="z-out" aria-label="Zoom out">−</button><button class="btn" id="z-in" aria-label="Zoom in">+</button></div>
    </div>

    <aside class="sheet" aria-label="Details">
      <div class="tabs" role="tablist">
        <button data-tab="inspect" class="on">Selected</button>
        <button data-tab="site">Site</button>
        <button data-tab="water">Water</button>
        <button data-tab="costs">Costs</button>
        <button data-tab="checks">Checks</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </main>
</div>
<div id="modal" class="modal" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   North Landing Sauna Designer
   Units: metres (plan), mm where noted. Plan x → east-ish, y → down.
   ============================================================ */
const $=s=>document.querySelector(s);
const D2R=Math.PI/180, R2D=180/Math.PI;
const uid=()=>Math.random().toString(36).slice(2,9);
const fx=(v,n=2)=>(Math.round(v*10**n)/10**n).toFixed(n);
const gbp=v=>'£'+Math.round(v).toLocaleString('en-GB');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const snapV=v=>S.ui.snap?Math.round(v/0.05)*0.05:v;

/* ---------- catalogue ---------- */
const TYPES={
  deck:{label:'Deck',sw:'var(--timber)',w:4,d:3,h:0,level:0.5,props:{material:'thermo',boardDir:'x',joist:400}},
  sauna:{label:'Sauna',sw:'var(--cedar)',w:2.4,d:2.2,h:2.4,props:{style:'cabin',heater:'wood',glass:true}},
  steps:{label:'Steps',sw:'var(--timber-2)',w:1.2,d:1,h:0,props:{top:'auto',topManual:0.6,going:0.3}},
  plunge:{label:'Cold plunge',sw:'var(--water)',w:1.1,d:1.1,h:1.0,props:{shape:'round',mount:'sunk',chiller:true,fill:'mains'}},
  shower:{label:'Outdoor shower',sw:'var(--panel)',w:0.9,d:0.9,h:2.2,props:{}},
  bench:{label:'Bench',sw:'var(--panel)',w:1.8,d:0.45,h:0.45,props:{}},
  hut:{label:'Changing hut',sw:'var(--panel)',w:2,d:1.5,h:2.3,props:{}},
  store:{label:'Log store',sw:'var(--panel)',w:1.2,d:0.7,h:1.6,props:{}},
  paving:{label:'Path / paving',sw:'var(--line)',w:1.2,d:3,h:0.05,props:{}},
};
const PALETTE=[
  ['deck',null,'Deck'],['sauna',{style:'cabin'},'Cabin sauna'],['sauna',{style:'barrel',w:2.4,d:2.0,h:2.0},'Barrel sauna'],
  ['steps',null,'Steps'],['plunge',{shape:'round'},'Plunge (round tub)'],['plunge',{shape:'rect',w:1.7,d:0.9,h:0.9},'Plunge (rectangular)'],
  ['shower',null,'Outdoor shower'],['bench',null,'Bench'],['hut',null,'Changing hut'],['store',null,'Log store'],['paving',null,'Path / paving'],
];
const SVC={mains:{label:'Mains water',dash:''},drain:{label:'Drain / overflow',dash:'6 4'},power:{label:'Power cable',dash:'2 4'}};
const RULES={
  private:{label:'Private use (Part K, dwellings)',rMin:.15,rMax:.22,gMin:.22,gMax:.30,guard:.60,hrBoth:false},
  commercial:{label:'Public / commercial (Parts K & M)',rMin:.15,rMax:.17,gMin:.28,gMax:.425,guard:.38,hrBoth:true},
};
const MAT={thermo:'Thermo-ash',larch:'Siberian larch',composite:'Capped composite',hardwood:'Hardwood (balau)'};
const RATE_DEFS={
  board_thermo:['Thermo-ash decking boards','m²',78], board_larch:['Siberian larch decking boards','m²',48],
  board_composite:['Capped composite boards','m²',88], board_hardwood:['Hardwood (balau) boards','m²',96],
  joist:['C24 UC4 joists 47×150','lm',5.6], bearer:['Double 47×150 bearers','lm',11.5],
  post:['Ground screws / adjustable posts','ea',48], fixings:['A4 stainless deck screws','ea',0.28],
  balustrade:['Balustrade 1.1 m, A4 fixings','lm',145], stringer:['Step stringers','ea',35], tread:['Step treads','m',42], handrail:['Handrail','lm',58],
  sauna_cabin:['Cabin sauna kit (by footprint)','m²',1750], sauna_barrel:['Barrel sauna kit (by footprint)','m²',1450],

/* ---------- geometry ---------- */
const isRound=it=>it.type==='plunge'&&it.props.shape==='round';
function frame(it){const a=it.rot*D2R;return{c:Math.cos(a),s:Math.sin(a)}}
function toWorld(it,lx,ly){const{c,s}=frame(it);return[it.x+lx*c-ly*s,it.y+lx*s+ly*c]}
function toLocal(it,px,py){const{c,s}=frame(it);const dx=px-it.x,dy=py-it.y;return[dx*c+dy*s,-dx*s+dy*c]}
function inside(it,px,py,pad=0){if(isRound(it))return Math.hypot(px-it.x,py-it.y)<=it.w/2+pad;const[lx,ly]=toLocal(it,px,py);return Math.abs(lx)<=it.w/2+pad&&Math.abs(ly)<=it.d/2+pad}
function corners(it){return[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>toWorld(it,a*it.w/2,b*it.d/2))}
function planDir(bearing){const t=(S.site.north+bearing)*D2R;return[Math.sin(t),-Math.cos(t)]}
function groundAt(x,y){const f=planDir(S.site.fall);return-(S.site.slope/100)*(x*f[0]+y*f[1])}
function deckAt(x,y,excl){let best=null;for(const it of S.items)if(it.type==='deck'&&it.id!==excl&&inside(it,x,y))best=best==null?it.level:Math.max(best,it.level);return best}
function baseAt(x,y,excl){const d=deckAt(x,y,excl);return d==null?groundAt(x,y):d}
const rules=()=>RULES[S.site.use]||RULES.commercial;
function plungeLevels(it){const dk=deckAt(it.x,it.y);if(it.props.mount==='sunk'){const rim=dk??groundAt(it.x,it.y);return{rim,bottom:rim-it.h,base:rim-it.h}}const base=dk??groundAt(it.x,it.y);return{rim:base+it.h,bottom:base,base}}
function itemBase(it){if(it.type==='deck')return it.level;if(it.type==='plunge')return plungeLevels(it).base;return baseAt(it.x,it.y)}

function solveSteps(it){
  const r=rules();let c={};
  for(let k=0;k<5;k++){
    const T=toWorld(it,0,-it.d/2);
    let dk=null;for(const off of[0.06,0.15,0.3]){const pr=toWorld(it,0,-it.d/2-off);dk=deckAt(pr[0],pr[1]);if(dk!=null)break}
    const auto=it.props.top==='auto'&&dk!=null;
    const top=auto?dk:+it.props.topManual;
    const foot=toWorld(it,0,it.d/2), g=groundAt(foot[0],foot[1]);
    const rise=Math.max(0,top-g);
    const n=Math.max(1,Math.ceil(rise/r.rMax-1e-6));
    const riser=rise/n, going=+it.props.going;
    const run=Math.max((n-1)*going,0.3);
    const{c:co,s:si}=frame(it);
    it.d=run;it.x=T[0]-(run/2)*si;it.y=T[1]+(run/2)*co;
    c={top,g,rise,n,riser,going,run,auto,treads:n-1};
  }
  c.sum=2*c.riser+c.going;
  c.okR=c.riser>=r.rMin-1e-3&&c.riser<=r.rMax+1e-3; c.okG=c.going>=r.gMin-1e-3&&c.going<=r.gMax+1e-3; c.okS=c.sum>=.55-1e-3&&c.sum<=.70+1e-3;
  c.handrails=c.rise<=0.6&&!r.hrBoth?0:(r.hrBoth&&c.n>=2)||it.w>1.0?2:1;
  if(c.rise<0.05)c.handrails=0;
  c.stringerLen=Math.hypot(c.run,c.rise)+0.15;
  it._c=c;return c;
}
function resolve(){for(const it of S.items)if(it.type==='steps')solveSteps(it)}

const EDGES=[{a:[-1,-1],b:[1,-1],n:[0,-1]},{a:[1,-1],b:[1,1],n:[1,0]},{a:[1,1],b:[-1,1],n:[0,1]},{a:[-1,1],b:[-1,-1],n:[-1,0]}];
function guardSegments(dk){
  const thr=rules().guard,segs=[];
  for(const E of EDGES){
    const ax=E.a[0]*dk.w/2,ay=E.a[1]*dk.d/2,bx=E.b[0]*dk.w/2,by=E.b[1]*dk.d/2;
    const len=Math.hypot(bx-ax,by-ay),N=Math.max(2,Math.round(len/0.15));
    let run=null;
    const flush=()=>{if(run&&run.t1-run.t0>0.04){const A=toWorld(dk,ax+(bx-ax)*run.t0,ay+(by-ay)*run.t0),B=toWorld(dk,ax+(bx-ax)*run.t1,ay+(by-ay)*run.t1);segs.push({a:A,b:B,len:len*(run.t1-run.t0),drop:run.drop})}run=null};
    for(let i=0;i<N;i++){
      const t=(i+.5)/N,lx=ax+(bx-ax)*t,ly=ay+(by-ay)*t;
      const W=toWorld(dk,lx+E.n[0]*.08,ly+E.n[1]*.08),Q=toWorld(dk,lx-E.n[0]*.1,ly-E.n[1]*.1);
      let need=false,drop=0;
      const wall=S.items.some(o=>(o.type==='sauna'||o.type==='hut'||o.type==='store')&&(inside(o,Q[0],Q[1])||inside(o,W[0],W[1])));
      const opening=S.items.some(o=>o.type==='steps'&&inside(o,W[0],W[1],0.02));
      if(!wall&&!opening){drop=dk.level-baseAt(W[0],W[1],dk.id);need=drop>thr}
      if(need){if(!run)run={t0:i/N,t1:(i+1)/N,drop};else{run.t1=(i+1)/N;run.drop=Math.max(run.drop,drop)}}else flush();
    }
    flush();
  }
  return segs;
}
function deckCalc(dk){
  const along=dk.props.boardDir==='x'?dk.w:dk.d, across=dk.props.boardDir==='x'?dk.d:dk.w;
  const area=dk.w*dk.d, rows=Math.ceil(across/0.15), boardLm=rows*along*1.1;
  const js=(+dk.props.joist||400)/1000, joists=Math.ceil(along/js)+1, joistLm=joists*across;
  const bearers=Math.ceil(across/1.8)+1, bearerLm=bearers*along, posts=bearers*(Math.ceil(along/1.8)+1);
  const hs=corners(dk).map(([x,y])=>dk.level-groundAt(x,y));
  const guards=guardSegments(dk), guardLm=guards.reduce((a,g)=>a+g.len,0);
  return{area,rows,boardLm,joists,joistLm,bearers,bearerLm,posts,screws:rows*joists*2,hMin:Math.min(...hs),hMax:Math.max(...hs),guards,guardLm};
}
function saunaCalc(it){
  let vol,floor;
  if(it.props.style==='barrel'){const r=it.d/2-0.05,L=it.w-0.1;vol=Math.PI*r*r*L*0.9;floor=L*(it.d-0.5)}
  else{const t=0.12;floor=(it.w-2*t)*(it.d-2*t);vol=floor*Math.max(1.8,it.h-0.35)}
  const seats=Math.max(2,Math.floor(floor/0.7));
  const kw=Math.ceil(vol*1.0+(it.props.glass?1.5:0));
  return{vol,floor,seats,kw};
}
function plungeCalc(it){const v=isRound(it)?Math.PI*(it.w/2-0.05)**2*it.h:(it.w-0.1)*(it.d-0.1)*it.h;return{vol:v*1000,fill:v*1000*0.9}}
function svcLen(s){let L=0;for(let i=1;i<s.pts.length;i++)L+=Math.hypot(s.pts[i][0]-s.pts[i-1][0],s.pts[i][1]-s.pts[i-1][1]);return L}

/* ---------- sun ---------- */
function isBST(y,m,d,h){const lastSun=mm=>{const dt=new Date(Date.UTC(y,mm+1,0));return dt.getUTCDate()-dt.getUTCDay()};if(m<2||m>9)return false;if(m>2&&m<9)return true;if(m===2)return d>lastSun(2)||(d===lastSun(2)&&h>=1);return d<lastSun(9)||(d===lastSun(9)&&h<1)}
function localToUTC(dateStr,timeStr){const[y,m,d]=dateStr.split('-').map(Number);const[h,mi]=(timeStr||'12:00').split(':').map(Number);const off=isBST(y,m-1,d,h)?1:0;return new Date(Date.UTC(y,m-1,d,h-off,mi))}
function sunPos(date,lat,lon){
  const rad=D2R,jd=date.getTime()/86400000+2440587.5,T=(jd-2451545)/36525;
  const L0=((280.46646+T*(36000.76983+T*0.0003032))%360+360)%360,M=357.52911+T*(35999.05029-0.0001537*T),e=0.016708634-T*(0.000042037+0.0000001267*T);
  const C=Math.sin(M*rad)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*M*rad)*(0.019993-0.000101*T)+Math.sin(3*M*rad)*0.000289;
  const om=125.04-1934.136*T,lam=L0+C-0.00569-0.00478*Math.sin(om*rad);
  const eps0=23+(26+(21.448-T*(46.815+T*(0.00059-T*0.001813)))/60)/60,eps=eps0+0.00256*Math.cos(om*rad);
  const dec=Math.asin(Math.sin(eps*rad)*Math.sin(lam*rad)),y=Math.tan(eps*rad/2)**2;
  const eqt=4*R2D*(y*Math.sin(2*L0*rad)-2*e*Math.sin(M*rad)+4*e*y*Math.sin(M*rad)*Math.cos(2*L0*rad)-0.5*y*y*Math.sin(4*L0*rad)-1.25*e*e*Math.sin(2*M*rad));
  const mins=date.getUTCHours()*60+date.getUTCMinutes()+date.getUTCSeconds()/60;
  let ha=(mins+eqt+4*lon)/4-180;if(ha<-180)ha+=360;
  const la=lat*rad,cz=Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(ha*rad);
  const alt=90-Math.acos(Math.max(-1,Math.min(1,cz)))*R2D;
  const az=(Math.atan2(Math.sin(ha*rad),Math.cos(ha*rad)*Math.sin(la)-Math.tan(dec)*Math.cos(la))*R2D+180+360)%360;
  return{alt,az};
}
function sunDay(){
  const s=S.site,pts=[];let rise=null,set=null,prev=null;
  for(let m=0;m<=1440;m+=10){const hh=String(Math.floor(m/60)%24).padStart(2,'0'),mm=String(m%60).padStart(2,'0');const p=sunPos(localToUTC(s.date,hh+':'+mm),s.lat,s.lon);p.m=m;pts.push(p);
    if(prev){if(prev.alt<-0.83&&p.alt>=-0.83)rise=m;if(prev.alt>=-0.83&&p.alt<-0.83)set=m}prev=p}
  return{pts,rise,set,now:sunPos(localToUTC(s.date,s.time),s.lat,s.lon)};
}
const hm=m=>m==null?'—':String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

/* ---------- persistence / history ---------- */
const KEY='nl-sauna-v1',BGKEY='nl-sauna-bg';
function save(){try{const o=clone(S);o.bg=S.bg?Object.assign({},S.bg,{src:null}):null;localStorage.setItem(KEY,JSON.stringify(o));if(S.bg)localStorage.setItem(BGKEY,S.bg.src);else localStorage.removeItem(BGKEY)}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);if(!t)return null;const o=JSON.parse(t);if(o.bg){const src=localStorage.getItem(BGKEY);if(src)o.bg.src=src;else o.bg=null}return normalise(o)}catch(e){return null}}
function normalise(o){const ex=example();if(o.site&&o.site.lat===54.129&&o.site.lon===-0.101){o.site.lat=ex.site.lat;o.site.lon=ex.site.lon}o.site=Object.assign({},ex.site,o.site||{});o.rates=Object.assign(defaultRates(),o.rates||{});o.items=(o.items||[]).map(it=>Object.assign(mk(it.type in TYPES?it.type:'paving'),it,{props:Object.assign(clone(TYPES[it.type]?.props||{}),it.props||{})}));o.services=o.services||[];o.checks=o.checks||{};o.ui=Object.assign({snap:true},o.ui||{});return o}
function commit(){const snap=JSON.stringify(Object.assign({},S,{bg:S.bg?Object.assign({},S.bg,{src:'#'}):null}));if(undoStack.at(-1)!==snap){undoStack.push(snap);if(undoStack.length>120)undoStack.shift();redoStack.length=0}save();renderAll()}
function restore(snap){const bg=S.bg;S=JSON.parse(snap);if(S.bg)S.bg.src=bg?bg.src:null;if(S.bg&&!S.bg.src)S.bg=null;if(selId&&!S.items.find(i=>i.id===selId)&&!S.services.find(s=>s.id===selId))selId=null;save();renderAll()}
function undo(){if(undoStack.length<2)return;redoStack.push(undoStack.pop());restore(undoStack.at(-1))}
function redo(){if(!redoStack.length)return;const s=redoStack.pop();undoStack.push(s);restore(s)}

/* ---------- calculations: BOM & checks ---------- */
function bom(){
  const rows=[],R=S.rates,add=(g,key,qty,note)=>{if(qty>0)rows.push({g,key,qty,note})};
  const decks=S.items.filter(i=>i.type==='deck');
  for(const dk of decks){const c=deckCalc(dk),g='Decking — '+dk.name;
    add(g,'board_'+dk.props.material,c.area*1.1,`${fx(c.area,1)} m² + 10% waste ≈ ${Math.ceil(c.boardLm)} lm of 145 mm board`);
    add(g,'joist',c.joistLm,`${c.joists} joists @ ${dk.props.joist} mm c/c`);
    add(g,'bearer',c.bearerLm,`${c.bearers} lines, ≤1.8 m spans`);
    add(g,'post',c.posts,`deck ${fx(c.hMin)}–${fx(c.hMax)} m above ground`);
    add(g,'fixings',c.screws,'2 per board per joist');
    add(g,'balustrade',c.guardLm,'edges with a drop over '+(rules().guard*1000)+' mm');
  }
  for(const st of S.items.filter(i=>i.type==='steps')){const c=st._c||solveSteps(st),g='Steps — '+st.name;if(c.rise<0.05)continue;
    add(g,'stringer',st.w>0.9?3:2,`${fx(c.stringerLen)} m long each`);add(g,'tread',c.treads*st.w,`${c.treads} treads × ${fx(st.w)} m`);add(g,'handrail',c.handrails*c.stringerLen,c.handrails+' side(s)')}
  for(const it of S.items){const g=TYPES[it.type].label+' — '+it.name;
    if(it.type==='sauna'){add(g,'sauna_'+it.props.style,it.w*it.d,`${fx(it.w,1)} × ${fx(it.d,1)} m footprint`);add(g,it.props.heater==='wood'?'heater_wood':'heater_elec',1,`≈${saunaCalc(it).kw} kW for ${fx(saunaCalc(it).vol,1)} m³`)}
    if(it.type==='plunge'){add(g,'plunge_'+it.props.shape,1,`${Math.round(plungeCalc(it).vol)} L`);if(it.props.chiller)add(g,'chiller',1,'')}
    if(it.type==='shower')add(g,'shower',1,'');
    if(it.type==='hut')add(g,'hut',it.w*it.d,'');
    if(it.type==='bench')add(g,'bench',1,'');
    if(it.type==='store')add(g,'store',1,'');
    if(it.type==='paving')add(g,'paving',it.w*it.d,'');
  }
  const L=k=>S.services.filter(s=>s.kind===k).reduce((a,s)=>a+svcLen(s),0);
  const lm=L('mains'),ld=L('drain'),lp=L('power');
  if(lm>0){const g='Mains water';add(g,'mains_conn',1,'confirm with Yorkshire Water');add(g,'stopcock',1,'');add(g,'mdpe',lm*1.05,`${fx(lm,1)} m run + 5%`);add(g,'trench',lm,'');
    const outlets=S.items.filter(i=>(i.type==='plunge'&&i.props.fill==='mains')||i.type==='shower').length;add(g,'frost',outlets*2.5,`${outlets} outlet(s) × 2.5 m above ground`);
    if(S.items.some(i=>i.type==='plunge'&&i.props.fill==='mains'))add(g,'backflow',1,'fluid category 5 protection')}
  if(ld>0){const g='Drainage';add(g,'drain_pipe',ld,`${fx(ld,1)} m`);add(g,'trench',ld,'');add(g,'soakaway',1,'')}
  if(lp>0){const g='Power';add(g,'swa',lp*1.1,`${fx(lp,1)} m + 10%`);add(g,'trench',lp,'separate from water');add(g,'elec_conn',1,'')}
  for(const r of rows){r.rate=+R[r.key];r.total=r.qty*r.rate}
  const sub=rows.reduce((a,r)=>a+r.total,0);
  return{rows,sub,cont:sub*(+R.contingency||0)/100,total:sub*(1+(+R.contingency||0)/100)};
}
function checks(){
  const out=[],r=rules(),push=(id,level,title,body)=>out.push({id,level,title,body});
  for(const dk of S.items.filter(i=>i.type==='deck')){const c=deckCalc(dk);
    if(c.guardLm>0)push('g-'+dk.id,'warn',`${dk.name}: guarding needed on ${fx(c.guardLm,1)} m of edge`,`The deck sits up to ${fx(c.hMax)} m above ground. Edges with a drop over ${r.guard*1000} mm need a 1100 mm guard that a child can't climb or pass a 100 mm sphere through. Shown in orange on the plan.`);
    else push('g-'+dk.id,'ok',`${dk.name}: no guarding needed`,`Highest edge is ${fx(c.hMax)} m above ground, under the ${r.guard*1000} mm threshold for ${r.label.toLowerCase()}.`);
    if(c.hMax>0.3)push('pd-'+dk.id,'info',`${dk.name}: over 300 mm high`,'Decking more than 300 mm above ground is outside householder permitted development. At North Landing assume full planning permission is needed anyway (see planning note).');
  }
  for(const st of S.items.filter(i=>i.type==='steps')){const c=st._c||solveSteps(st);
    if(c.rise<0.05){push('s-'+st.id,'info',`${st.name}: no rise`,'These steps meet ground level. Move them so the top edge touches a deck.');continue}
    const bad=!(c.okR&&c.okG&&c.okS);
    push('s-'+st.id,bad?'bad':'ok',`${st.name}: ${c.n} risers of ${Math.round(c.riser*1000)} mm, ${Math.round(c.going*1000)} mm going`,
      `Rise ${Math.round(c.rise*1000)} mm (deck at ${fx(c.top)} m, ground at ${fx(c.g)} m). Limits for ${r.label.toLowerCase()}: riser ${r.rMin*1000}–${r.rMax*1000} mm, going ${r.gMin*1000}–${r.gMax*1000} mm, 2R+G 550–700 mm (now ${Math.round(c.sum*1000)} mm). Handrails: ${c.handrails||'none'}${c.handrails?' side(s), 900–1000 mm above the pitch line':''}.`+(c.okR?'':' Riser out of range.')+(c.okG?'':' Going out of range — change it in Selected.')+(c.okS?'':' 2R+G out of range.'));
  }
  const plunges=S.items.filter(i=>i.type==='plunge');
  if(plunges.some(p=>p.props.fill==='mains'))push('wf','warn','Plunge on mains: backflow protection','Under the Water Supply (Water Fittings) Regulations 1999 a plunge pool is high-risk (fluid category 5). Fill it through a type AA/AB air gap or a break cistern, never a hose left in the water. You must notify Yorkshire Water before installing the fittings.');
  if(S.services.some(s=>s.kind==='mains')){
    push('conn','info','New mains connection','Apply to Yorkshire Water for a new supply (and a meter). Lead times run to weeks; budget figure is in Costs. The landowner must consent to the route.');
    push('cover',+S.site.cover>=750?'ok':'bad',`Pipe cover: ${S.site.cover} mm`,+S.site.cover>=750?'Meets the usual 750 mm minimum cover for frost protection.':'Bury supply pipe with at least 750 mm cover (max 1350 mm). Lag and trace-heat any pipe that rises above ground, or fit a drain-down valve for winter.');
  }
  if(plunges.length)push('drain','warn','Plunge water disposal','Treated or chlorinated water must not go to the beach, a watercourse or a surface-water drain without Environment Agency agreement. Flamborough sits on the chalk aquifer: check groundwater protection before a soakaway, or tanker / foul-drain it. Dechlorinate before discharge.');
  for(const s of S.items.filter(i=>i.type==='sauna')){const c=saunaCalc(s);
    if(s.props.heater==='wood')push('fire-'+s.id,'warn',`${s.name}: wood-fired stove on a timber deck`,'Stand the stove on a non-combustible hearth, keep manufacturer clearances, fit a spark arrestor and use a twin-wall insulated flue through the roof. Onshore winds will push smoke across the deck, so site the flue downwind of the seating where you can.');
    else if(c.kw>9)push('ph-'+s.id,'warn',`${s.name}: ${c.kw} kW heater`,'Heaters over about 9 kW usually need a three-phase supply. Check what is available at the car park or kiosk before choosing electric.');
    else push('ph-'+s.id,'info',`${s.name}: ${c.kw} kW electric heater`,'A dedicated radial circuit with RCD protection, installed and certified under Part P / BS 7671.');
  }
  push('wind','warn','Exposed clifftop: wind and salt','North Landing faces the North Sea. Winter northerly and north-easterly gales are onshore here. Anchor the sauna and plunge against uplift (ground screws or strapping to the substructure), use A4 (316) stainless fixings throughout, and choose thermally modified or naturally durable timber.');
  push('plan','bad','Planning and protected-site consents','The site is inside the Flamborough Headland Heritage Coast and next to the Flamborough Head SSSI, the Flamborough Head SAC and the Flamborough & Filey Coast SPA (seabirds). Expect a full application to East Riding of Yorkshire Council, consultation with Natural England, and landowner consent. Anything below mean high water springs also needs a marine licence from the MMO.');
  if(S.site.use==='commercial')push('m','info','Public use: access and safety','For paying customers: wet-slip resistant decking (grooved or with anti-slip inserts near the plunge), a risk assessment for cold-water immersion, clear depth signage on the plunge, and an accessible route where reasonably practicable (Part M).');
  return out;
}

/* ---------- map underlay (web mercator tiles, fetched by the viewer's browser) ---------- */
const TILES={
  satellite:{url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,max:19,attr:'Imagery © Esri, Maxar, Earthstar Geographics'},
  street:{url:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`,max:19,attr:'© OpenStreetMap contributors'},
};
const MLAT=110574,mlon=lat=>111320*Math.cos((lat??S.site.lat)*D2R);
const lon2tx=(lon,z)=>(lon+180)/360*2**z, lat2ty=(lat,z)=>{const r=lat*D2R;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z};
const tx2lon=(x,z)=>x/2**z*360-180, ty2lat=(y,z)=>R2D*Math.atan(Math.sinh(Math.PI-2*Math.PI*y/2**z));
const tileState={els:new Map(),ok:0,err:0,blocked:false};
function renderTiles(){
  const layer=document.getElementById('tiles'),src=TILES[S.site.map],attr=$('#attr');
  if(!src){if(tileState.els.size){layer.innerHTML='';tileState.els.clear()}attr.hidden=true;return}
  attr.hidden=false;attr.textContent=src.attr;
  const{W,H}=vp(),s=view.s,tx=W/2-view.cx*s,ty=H/2-view.cy*s,N=S.site.north;
  // layer coords: x = metres east of origin, y = metres south; rotated so plan north matches
  layer.setAttribute('transform',`translate(${tx} ${ty}) scale(${s}) rotate(${N})`);layer.setAttribute('opacity',S.site.mapOpacity);
  const t=-N*D2R,ens=[[0,0],[W,0],[0,H],[W,H]].map(([a,b])=>{const[px,py]=s2w(a,b);return[px*Math.cos(t)-py*Math.sin(t),-(px*Math.sin(t)+py*Math.cos(t))]});
  const lat0=S.site.lat,lon0=S.site.lon,ml=mlon(lat0);
  const lats=ens.map(e=>lat0+e[1]/MLAT),lons=ens.map(e=>lon0+e[0]/ml);
  let z=Math.round(Math.log2(156543.03*Math.cos(lat0*D2R)*s*Math.min(2,devicePixelRatio||1)));
  z=Math.max(12,Math.min(src.max,z));
  let x0,x1,y0,y1;
  for(;;){x0=Math.floor(lon2tx(Math.min(...lons),z));x1=Math.floor(lon2tx(Math.max(...lons),z));y0=Math.floor(lat2ty(Math.max(...lats),z));y1=Math.floor(lat2ty(Math.min(...lats),z));
    if((x1-x0+1)*(y1-y0+1)<=120||z<=12)break;z--}
  const want=new Set();
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
    const key=S.site.map+'/'+z+'/'+x+'/'+y;want.add(key);let el=tileState.els.get(key);
    if(!el){el=document.createElementNS('http://www.w3.org/2000/svg','image');el.setAttribute('href',src.url(z,x,y));el.setAttribute('preserveAspectRatio','none');el.style.pointerEvents='none';
      el.addEventListener('load',()=>{tileState.ok++;if(tileState.blocked){tileState.blocked=false;renderHint()}});
      el.addEventListener('error',()=>{tileState.err++;if(!tileState.ok&&!tileState.blocked){tileState.blocked=true;renderHint()}});
      el.dataset.z=z;tileState.els.set(key,el);layer.appendChild(el)}
    const e0=(tx2lon(x,z)-lon0)*ml,e1=(tx2lon(x+1,z)-lon0)*ml,n0=(ty2lat(y,z)-lat0)*MLAT,n1=(ty2lat(y+1,z)-lat0)*MLAT;
    el.setAttribute('x',e0);el.setAttribute('y',-n0);el.setAttribute('width',e1-e0+0.02);el.setAttribute('height',n0-n1+0.02);
  }
  for(const[k,el]of tileState.els)if(!want.has(k)){el.remove();tileState.els.delete(k)}
}

/* ---------- plan rendering ---------- */
const plan=$('#plan');
function vp(){const r=plan.getBoundingClientRect();return{W:r.width||800,H:r.height||600,r}}
function w2s(x,y){const{W,H}=vp();return[(x-view.cx)*view.s+W/2,(y-view.cy)*view.s+H/2]}
function s2w(px,py){const{W,H}=vp();return[(px-W/2)/view.s+view.cx,(py-H/2)/view.s+view.cy]}
function evW(e){const r=plan.getBoundingClientRect();return s2w(e.clientX-r.left,e.clientY-r.top)}
function niceStep(px){const c=[0.1,0.2,0.25,0.5,1,2,5,10,20,50];for(const v of c)if(v*view.s>=px)return v;return 100}

function renderPlan(){
  renderTiles();
